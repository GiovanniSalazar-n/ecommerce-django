{% extends "base.html" %}

{% block base_head %}
<style>
  
  .page-wrap {
    max-width: 900px;
    margin: 0 auto;
  }

  .card-box {
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    padding: 16px;
    background: #fff;
  }

  .section {
    margin: 18px 0;
  }

  .muted {
    color: #666;
    font-size: 0.95rem;
  }

  .bold {
    font-weight: bold;
  }

  .pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    border: 1px solid #ddd;
    font-size: 0.85rem;
    margin-left: 8px;
  }

  .divider {
    margin: 18px 0;
    border: 0;
    border-top: 1px solid #eee;
  }
</style>
{% endblock %}

{% block content %}
<div class="page-wrap">
  {% block page_content %}{% endblock %}
</div>
{% endblock %}
